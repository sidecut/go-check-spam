run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters-settings:
  govet:
    enable:
      - shadow # Warns about shadowed variables
  errcheck:
    check-blank: true # Warns when errors are assigned to "_" blank identifier

linters:
  disable-all: true
  enable:
    - errcheck     # Checks for unchecked errors
    - gosimple     # Suggests code simplifications
    - govet        # Reports suspicious constructs (like printf formatting mistakes)
    - ineffassign  # Detects unused assignments
    - staticcheck  # Advanced bug finding
    - unused       # Checks for unused constants, variables, functions, and types
    - revive       # Flexible linter (replaces the deprecated golint)
